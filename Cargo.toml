[package]
name = "godot-wasmtime"
version = "0.1.0"
edition = "2021"
description = "Godot WASM UGC Runtime - GDExtension for executing sandboxed WASM mods with a GDScript-facing host API"
license = "CC-BY-NC-SA-4.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
godot = "0.5.6"
wasmtime = "51"
wasmtime-wasi = "51"

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
