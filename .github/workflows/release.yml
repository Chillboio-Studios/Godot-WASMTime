name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0) — creates a GitHub release with this tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Native-ish builds (runner arch == target arch)
  # ------------------------------------------------------------------
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --locked
        working-directory: .
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/libgodot_wasmtime.so dist/libgodot_wasmtime.linux.x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/godot_wasmtime.dll dist/libgodot_wasmtime.windows.x86_64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target aarch64-pc-windows-msvc
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/godot_wasmtime.dll dist/libgodot_wasmtime.windows.arm64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/

  macos-x86_64:
    # Intel runners (macos-13) are retired; the macOS SDK is universal so we
    # cross-compile x86_64 from the ARM runner instead.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/libgodot_wasmtime.dylib dist/libgodot_wasmtime.macos.x86_64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --locked
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/libgodot_wasmtime.dylib dist/libgodot_wasmtime.macos.arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/

  # ------------------------------------------------------------------
  # Cross-compiled builds
  # ------------------------------------------------------------------
  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/libgodot_wasmtime.so dist/libgodot_wasmtime.linux.aarch64.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
    env:
      ANDROID_API_LEVEL: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android NDK
        run: |
          curl -sL -o /tmp/android-ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          mkdir -p "$HOME/android-ndk"
          unzip -q /tmp/android-ndk.zip -d "$HOME/android-ndk"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r26d" >> "$GITHUB_ENV"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${{ env.ANDROID_API_LEVEL }}-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${{ env.ANDROID_API_LEVEL }}-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${{ env.ANDROID_API_LEVEL }}-clang++
          AR_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          mkdir -p dist
          # artifact name uses dots: android.arm64 / android.x86_64
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            OUT=libgodot_wasmtime.android.arm64.so
          else
            OUT=libgodot_wasmtime.android.x86_64.so
          fi
          cp "target/${{ matrix.target }}/release/libgodot_wasmtime.so" "dist/$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target == 'aarch64-linux-android' && 'arm64' || 'x86_64' }}
          path: dist/

  # ------------------------------------------------------------------
  # Assemble + publish
  # ------------------------------------------------------------------
  release:
    needs: [linux-x86_64, linux-aarch64, windows-x86_64, windows-arm64, macos-x86_64, macos-arm64, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p package
          find artifacts -name "libgodot_wasmtime.*" -exec cp {} package/ \;
          ls -la package/
      - name: Write distribution .gdextension
        run: |
          cat > package/godot-wasmtime.gdextension <<'EOF'
          [configuration]

          entry_symbol = "gdext_rust_init"
          compatibility_minimum = 4.4
          reloadable = true


          [libraries]

          linux.debug.x86_64 = "libgodot_wasmtime.linux.x86_64.so"
          linux.release.x86_64 = "libgodot_wasmtime.linux.x86_64.so"
          linux.debug.aarch64 = "libgodot_wasmtime.linux.aarch64.so"
          linux.release.aarch64 = "libgodot_wasmtime.linux.aarch64.so"
          windows.debug.x86_64 = "libgodot_wasmtime.windows.x86_64.dll"
          windows.release.x86_64 = "libgodot_wasmtime.windows.x86_64.dll"
          windows.debug.arm64 = "libgodot_wasmtime.windows.arm64.dll"
          windows.release.arm64 = "libgodot_wasmtime.windows.arm64.dll"
          macos.debug.x86_64 = "libgodot_wasmtime.macos.x86_64.dylib"
          macos.release.x86_64 = "libgodot_wasmtime.macos.x86_64.dylib"
          macos.debug.arm64 = "libgodot_wasmtime.macos.arm64.dylib"
          macos.release.arm64 = "libgodot_wasmtime.macos.arm64.dylib"
          android.debug.arm64 = "libgodot_wasmtime.android.arm64.so"
          android.release.arm64 = "libgodot_wasmtime.android.arm64.so"
          android.debug.x86_64 = "libgodot_wasmtime.android.x86_64.so"
          android.release.x86_64 = "libgodot_wasmtime.android.x86_64.so"
          EOF
          sed -i 's/^          //' package/godot-wasmtime.gdextension
      - name: Zip package
        run: cd package && zip -r ../godot-wasmtime-gdextension.zip .
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            godot-wasmtime-gdextension.zip \
            --repo "${{ github.repository }}" \
            --title "godot-wasmtime ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --latest=false || \
          gh release upload "${{ steps.ver.outputs.tag }}" \
            godot-wasmtime-gdextension.zip \
            --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: godot-wasmtime-gdextension
          path: godot-wasmtime-gdextension.zip
